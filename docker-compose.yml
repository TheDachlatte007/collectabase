version: '3.8'

services:
  collectabase:
    build: .
    container_name: collectabase
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # Configure sources in stack.env for Portainer/TrueNAS deployments.
      - type: bind
        source: "${COLLECTABASE_DATA_DIR:-./data}"
        target: /app/data
      - type: bind
        source: "${COLLECTABASE_UPLOADS_DIR:-./uploads}"
        target: /app/uploads
      - type: bind
        source: "${COLLECTABASE_BACKUP_DIR:-./backups}"
        target: /app/backups
    environment:
      - DATABASE_URL=sqlite:////app/data/games.db
      - UPLOADS_DIR=/app/uploads
      - COLLECTABASE_BACKUP_DIR=/app/backups
      - TZ=Europe/Berlin
      # Optional: Uncomment and populate these if you want to set them system-wide instead of via the UI
      # - IGDB_CLIENT_ID=
      # - IGDB_CLIENT_SECRET=
      # - EBAY_CLIENT_ID=
      # - EBAY_CLIENT_SECRET=
      # - RAWG_API_KEY=
      # - ADMIN_API_KEY=
